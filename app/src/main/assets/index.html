<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip Money Manager</title><style>body{font:16px system-ui;background:#f1f5f9;color:#172033;margin:0}main{max-width:650px;margin:auto;padding:18px}h1{font-size:24px}.hero{background:#123b56;color:white;padding:22px;border-radius:18px}.amount{font-size:36px;font-weight:800}.panel{background:white;border-radius:15px;padding:16px;margin-top:14px}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;margin-top:7px}button{background:#087e83;color:white;border:0;font-weight:700;margin-top:10px}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #ddd;padding:10px 0}.muted{color:#64748b;font-size:13px}.danger{background:#fee2e2;color:#991b1b;width:auto;padding:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid div{background:white;padding:12px;border-radius:12px}</style></head><body><main><h1>🧳 Trip Money Manager</h1><div class="hero">Current trip balance<div class="amount" id="balance"></div></div><div class="grid"><div>Collected<br><b id="collected"></b></div><div>Spent<br><b id="spent"></b></div></div><div class="panel"><h3>Friends</h3><div id="people"></div><input id="friend" placeholder="New friend's name"><button onclick="addFriend()">Add friend</button></div><div class="panel"><h3>Add contribution</h3><select id="person"></select><input id="contribution" type="number" min="0.01" step="0.01" placeholder="Amount (LKR)"><button onclick="addMoney()">Save contribution</button></div><div class="panel"><h3>Add expense</h3><input id="title" placeholder="Expense (e.g. Fuel)"><input id="expense" type="number" min="0.01" step="0.01" placeholder="Amount (LKR)"><button onclick="addExpense()">Save expense</button></div><div class="panel"><h3>Equal expense share</h3><p class="muted">Each person's share of total spending. Positive = contributed more than their share; remaining trip cash is not yet distributed.</p><div id="shares"></div></div><div class="panel"><h3>Transactions</h3><div id="transactions"></div></div><div class="panel"><h3>Backup</h3><button onclick="backup()">Show backup JSON</button><textarea id="backup" style="width:100%;height:100px"></textarea><button onclick="restore()">Restore pasted backup</button></div></main><script>
const key='trip-money-manager-v1';const initial={people:[{id:1,name:'Friend 1'},{id:2,name:'Friend 2'},{id:3,name:'Friend 3'},{id:4,name:'Friend 4'},{id:5,name:'Friend 5'},{id:6,name:'Friend 6'}],tx:[{id:1,type:'in',person:1,amount:1000},{id:2,type:'in',person:2,amount:1000},{id:3,type:'in',person:3,amount:1000},{id:4,type:'in',person:4,amount:1000},{id:5,type:'in',person:5,amount:300}]};let data;try{data=JSON.parse(localStorage.getItem(key))||initial}catch(e){data=initial}const $=id=>document.getElementById(id);const money=n=>'Rs. '+n.toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(data));render()}function addFriend(){let n=$('friend').value.trim();if(!n)return alert('Enter name');data.people.push({id:Date.now(),name:n});$('friend').value='';save()}function addMoney(){let a=Number($('contribution').value),p=Number($('person').value);if(!(a>0)||!data.people.some(x=>x.id===p))return alert('Enter valid amount');data.tx.push({id:Date.now(),type:'in',person:p,amount:a});$('contribution').value='';save()}function addExpense(){let a=Number($('expense').value),t=$('title').value.trim();if(!(a>0)||!t)return alert('Enter title and amount');data.tx.push({id:Date.now(),type:'out',title:t,amount:a});$('expense').value='';$('title').value='';save()}function removeTx(id){if(confirm('Delete this transaction?')){data.tx=data.tx.filter(t=>t.id!==id);save()}}function rename(id){let p=data.people.find(x=>x.id===id),n=prompt('Friend name',p.name);if(n&&n.trim()){p.name=n.trim();save()}}function backup(){$('backup').value=JSON.stringify(data)}function restore(){try{let d=JSON.parse($('backup').value);if(!Array.isArray(d.people)||!Array.isArray(d.tx))throw Error();if(confirm('Replace current data with backup?')){data=d;save()}}catch(e){alert('Invalid backup')}}function render(){let totalIn=data.tx.filter(x=>x.type==='in').reduce((s,x)=>s+x.amount,0),totalOut=data.tx.filter(x=>x.type==='out').reduce((s,x)=>s+x.amount,0);$('balance').textContent=money(totalIn-totalOut);$('collected').textContent=money(totalIn);$('spent').textContent=money(totalOut);$('people').innerHTML=data.people.map(p=>'<div class="row"><span>'+esc(p.name)+'</span><button class="danger" onclick="rename('+p.id+')">Rename</button></div>').join('');$('person').innerHTML=data.people.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');$('shares').innerHTML=data.people.map(p=>{let paid=data.tx.filter(x=>x.type==='in'&&x.person===p.id).reduce((s,x)=>s+x.amount,0);return '<div class="row"><span>'+esc(p.name)+'</span><span>'+money(paid-totalOut/data.people.length)+'</span></div>'}).join('');$('transactions').innerHTML=[...data.tx].reverse().map(t=>'<div class="row"><span>'+esc(t.type==='in'?(data.people.find(p=>p.id===t.person)||{name:'Unknown'}).name:t.title)+'<br><small>'+esc(t.type==='in'?'Contribution':'Expense')+'</small></span><span>'+money(t.amount)+' <button class="danger" onclick="removeTx('+t.id+')">Delete</button></span></div>').join('')}render();
</script></body></html>
